<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice | PaperBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/app2.css">
  <link rel="stylesheet" href="assets/widget.css">
  <link rel="stylesheet" href="assets/premium.css">
  <link rel="stylesheet" href="assets/glass.css">
  <style>
    .gen-wrap { max-width: 900px; margin: 0 auto; }
    .loading { text-align: center; padding: 40px 10px; color: var(--muted); }
    .dots { display: inline-flex; gap: 6px; margin-bottom: 12px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); animation: dot 1.1s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%,80%,100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-7px); opacity: 1; } }
    .ai-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="logo">Z</span>
      <div><div class="brand-title">PaperBuddy</div><div class="brand-sub">Practice · all groups</div></div>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="groups.html" class="active">Groups</a>
      <a href="library.html">Library</a>
      <a href="gallery.html">Gallery</a>
      <a href="practice.html">Practice</a>
      <a href="chat.html">Chat</a>
      <span id="auth-slot"></span>
      <a class="gh-btn" href="https://github.com/MusabStudio/PaperBuddy" target="_blank" rel="noopener" aria-label="GitHub repository" title="View the source on GitHub"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg><span class="gh-label">GitHub</span></a>
    </nav>
  </header>

  <section class="hero small">
    <div class="hero-inner">
      <p class="eyebrow" id="crumb">Practice</p>
      <h1 id="title">Pick a subject</h1>
      <p class="lead" id="sub">Fresh AI-written questions for any group, checked one by one.</p>
    </div>
  </section>

  <main>
    <div class="gen-wrap">
      <section id="picker" class="section" style="padding-top:10px">
        <div class="subject-grid" id="subjects"></div>
      </section>

      <section id="board" hidden>
        <div class="section-head" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <div>
            <span class="chip chip-gold" id="set-chip">New set</span>
            <h2 id="set-title">Practice</h2>
          </div>
          <button class="btn btn-small" id="regen" type="button">🔄 New questions</button>
        </div>
        <div id="questions"></div>
      </section>

      <section id="loading" class="loading" hidden>
        <div class="dots"><i></i><i></i><i></i></div>
        <div>Writing a fresh paper for you…</div>
      </section>
    </div>
  </main>

  <footer>
    <p>AI-written practice. Always check against your textbook.</p>
    <p class="good">Good luck! 🍀</p>
  </footer>

  <script src="assets/library.js"></script>
  <script src="assets/boards.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/glass.js"></script>
  <script src="assets/widget.js"></script>
  <script src="assets/premium.js"></script>
  <script src="assets/practice-any.js"></script>
</body>
</html>
